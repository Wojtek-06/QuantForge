name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

      - name: Demo smoke
        run: |
          ./build/quantforge --config configs/stress_mm.json --out-dir build/reports
          ./build/quantforge --config configs/csv_replay.json --out-dir build/reports
          bash scripts/generate_evidence.sh
          test -f build/reports/mm_strategy_comparison_report.md
          test -f build/reports/csv_replay_mm_results.csv
          test -f build/reports/BENCHMARK.md
          test -f build/reports/stress_stale_quotes.json
          test -f build/reports/stress_toxic_flow.json
          test -f web/replay/sample_replay.json

      - name: Python risk bridge tests
        run: |
          python -m pip install -r python/requirements.txt
          PYTHONPATH=python python -m pytest python/tests -q
